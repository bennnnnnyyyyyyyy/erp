name: SQL tests (local Supabase)

# Runs every migration and every SQL test on a throwaway database started inside the runner (Supabase local stack in Docker).
# No secrets and no production data are involved; scripts/ci-sql-tests.sh refuses any database that is not localhost.
# This is a separate workflow: the deploy job in ci-deploy.yml does not depend on it, so an infrastructure outage here never blocks an
# API fix. It is meant to be a REQUIRED CHECK on pull requests (branch protection), because migrations reach live by hand, not by deploy.
#
# False results (6 Nov 2026): the job used to be continue-on-error, so a failing SQL test showed as a pass. Then an infrastructure
# hiccup (Docker registry "Rate exceeded", a port already in use) still showed as a pass with nothing tested (repo audit N12).
# Now: it runs on every pull request so it can be required; when nothing under sql/ changed it passes at once and says so; when SQL
# changed, the stack start is retried, and if it still cannot start the job FAILS with "tests did not run, re-run the job", so green
# only ever means "tests ran and passed".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'sql/**'
      - 'scripts/ci-sql-tests.sh'
      - '.github/workflows/sql-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-tests:
    name: Migrations and SQL tests on a throwaway local database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull requests: run only when SQL (or this test setup) changed. Pushes to main and manual runs always run.
      - name: Did SQL change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "sql=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(sql/|scripts/ci-sql-tests\.sh$|\.github/workflows/sql-tests\.yml$)'; then
            echo "sql=true" >> "$GITHUB_OUTPUT"
          else
            echo "sql=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SQL changes in this pull request; SQL tests not needed."
          fi

      - name: Set up the Supabase CLI
        if: steps.changes.outputs.sql == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Make sure psql is available
        if: steps.changes.outputs.sql == 'true'
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # `supabase start` applies whatever is in supabase/migrations/ to the empty database. That folder holds copies of 056 and 057 made
      # by `supabase db push` on 6 Nov (live's migration history), which fail without 001-055 first, so the stack never started and no
      # SQL test ran after 19:13 that day. The runner is thrown away, so remove them here only: scripts/ci-sql-tests.sh applies sql/
      # in full, and the files in the repository and live's history stay as they are.
      - name: Start from an empty database (migrations come from sql/)
        if: steps.changes.outputs.sql == 'true'
        run: rm -rf supabase/migrations

      # Up to three tries, cleaning up between them: image pulls are rate limited and a half-started stack can hold ports.
      - name: Start a local Supabase stack
        id: stack
        if: steps.changes.outputs.sql == 'true'
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "::warning::supabase start failed (attempt $attempt of 3); cleaning up and retrying"
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1

      - name: Fail because the tests could not run
        if: steps.changes.outputs.sql == 'true' && steps.stack.outcome != 'success'
        run: |
          echo "::error::The local database could not start after 3 tries (infrastructure, not our code). SQL tests did NOT run on this commit; re-run the job."
          exit 1

      - name: Apply migrations and run every SQL test
        if: steps.changes.outputs.sql == 'true' && steps.stack.outcome == 'success'
        run: bash scripts/ci-sql-tests.sh

      - name: Stop the local stack
        if: always() && steps.changes.outputs.sql == 'true'
        run: supabase stop --no-backup
