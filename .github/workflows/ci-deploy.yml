name: CI and Cloudflare deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Pull requests: one queue per branch, and a newer push cancels the older run (its result no longer matters). Pushes to main share
# one queue and are never cancelled, so two deploys never overlap or get cut off half way.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  API_URL: https://erp-api.meetings-dmedeskai.workers.dev

jobs:
  checks:
    name: Typecheck, tests and web build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Format and lint (biome.json: apps/api, packages/shared). Fails on errors and unformatted files, not on warnings.
      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Relative links between our own Markdown files must resolve (repo audit finding 6).
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs

      # Browser smoke test of every screen in the sample build (apps/web/e2e, no secrets, no database). A broken screen stops the deploy.
      - name: Install the smoke-test browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Smoke test every screen
        run: npm run test:e2e -w apps/web

      - name: Build web app
        run: npm run build -w apps/web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ env.API_URL }}

  deploy:
    name: Deploy Worker and Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://erp-live.pages.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app for production
        run: npm run build -w apps/web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ env.API_URL }}
          # Who sees "Fill with sample data" in the setup wizard (ONBOARDING_WIZARD_PLAN.md Part B): the accounts listed in the repository
          # variable DEMO_AUTOFILL_EMAILS (comma-separated, Settings → Secrets and variables → Actions → Variables). No account is built
          # in (repo audit finding 15): when the variable is not set, nobody sees the button.
          DEMO_AUTOFILL_EMAILS: ${{ vars.DEMO_AUTOFILL_EMAILS }}

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --var SUPABASE_URL:${{ secrets.SUPABASE_URL }} --var SUPABASE_PUBLISHABLE_KEY:${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy web app to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name erp-live --branch main
