name: CI and Cloudflare deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Pull requests: one queue per branch, and a newer push cancels the older run (its result no longer matters). Pushes to main share
# one queue and are never cancelled, so two deploys never overlap or get cut off half way.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24.x'
  API_URL: https://erp-api.meetings-dmedeskai.workers.dev

jobs:
  checks:
    name: Typecheck, tests and web build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Codex audit 18 Nov, finding 11: a pull request that changes only documentation (documentation/, *.md) skips the browser smoke
      # test below, as workflow-tests.yml already does. Everything else in this job still runs; pushes to main always run all of it.
      - name: Did only documentation change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qvE '^documentation/|\.md$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only documentation changed; the screen smoke test is not needed."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Format and lint (biome.json: apps/api, packages/shared). Fails on errors and unformatted files, not on warnings.
      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Relative links between our own Markdown files must resolve (repo audit finding 6).
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs

      # Parallel chats write migrations: no two may share a number, and each needs its row in sql/README.md.
      - name: Check migration numbers
        run: node scripts/check-migrations.mjs

      # Browser smoke test of every screen in the sample build (apps/web/e2e, no secrets, no database). A broken screen stops the deploy.
      # 11 Nov 2026: Ubuntu's package mirror did not resolve on GitHub's runners ("Temporary failure resolving
      # azure.archive.ubuntu.com"), so --with-deps failed on the font packages and three deploys never ran (#41, #42 twice). The runner
      # image already has most of Chromium's libraries: if the system packages cannot be fetched, install the browser alone. The smoke
      # test below still runs and still stops the deploy if a screen breaks (or if a library really is missing).
      - name: Install the smoke-test browser
        if: steps.changes.outputs.app == 'true'
        run: npx playwright install --with-deps chromium || { echo "::warning::System packages could not be fetched; installing the browser alone"; npx playwright install chromium; }
        working-directory: apps/web

      - name: Smoke test every screen
        if: steps.changes.outputs.app == 'true'
        run: npm run test:e2e -w apps/web

      # Invoice layout pictures (apps/web/e2e/print.e2e.ts) are kept per system and only the Windows set is in the repo, so the smoke
      # test above skips them here. When the Linux set is missing, make it and offer it as a download ("print-pictures-linux"); a
      # person looks at the pictures and commits them, and from then on this job compares against them. Never fails the job.
      - name: Make missing Linux print pictures
        id: printpics
        if: steps.changes.outputs.app == 'true'
        working-directory: apps/web
        run: |
          if ls e2e/print.e2e.ts-snapshots/*-linux.png >/dev/null 2>&1; then
            echo "Linux print pictures are in the repo; the smoke test compared against them."
          else
            npx playwright test print --project desktop --update-snapshots || echo "::warning::Could not make the Linux print pictures"
            if ls e2e/print.e2e.ts-snapshots/*-linux.png >/dev/null 2>&1; then echo "made=true" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Offer the new Linux print pictures
        if: steps.printpics.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: print-pictures-linux
          path: apps/web/e2e/print.e2e.ts-snapshots/*-linux.png
          retention-days: 14

      - name: Build web app
        run: npm run build -w apps/web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ env.API_URL }}

  deploy:
    name: Deploy Worker and Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://erp-live.pages.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app for production
        run: npm run build -w apps/web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ env.API_URL }}
          # Who sees "Fill with sample data" in the setup wizard (ONBOARDING_WIZARD_PLAN.md Part B): the accounts listed in the repository
          # variable DEMO_AUTOFILL_EMAILS (comma-separated, Settings → Secrets and variables → Actions → Variables). No account is built
          # in (repo audit finding 15): when the variable is not set, nobody sees the button.
          DEMO_AUTOFILL_EMAILS: ${{ vars.DEMO_AUTOFILL_EMAILS }}

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --var SUPABASE_URL:${{ secrets.SUPABASE_URL }} --var SUPABASE_PUBLISHABLE_KEY:${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy web app to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name erp-live --branch main
