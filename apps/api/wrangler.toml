name = "erp-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Efficiency audit 2026-11-04 (documentation/plans/2026-11-04-efficiency-audit.md, F1): the database is in eu-west-1 and every request
# makes several database calls, so run the Worker next to the database instead of next to the user. Cloudflare places it from observed
# traffic (it takes a few minutes of use to take effect). To undo, delete these two lines.
[placement]
mode = "smart"

# Non-secret settings only. SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY are passed at deploy time with --var (public, but kept out of the repo). Secrets (SUPABASE_SECRET_KEY) go in
# `wrangler secret put`, and in .dev.vars for local development.
# These are the deployed (production) values: only the live web app may call the API. Local development overrides
# APP_ENV and ALLOWED_ORIGINS from the repo-root .env (see .dev.vars.example).
[vars]
APP_ENV = "production"
# The live app FIRST (it is the default for "Open in the app" links and for invite and reset links). The second entry is the fixed address
# of the branch preview of the real app (Cloudflare Pages project erp-live, branch worktree-ui-warm), so the new look can be tried with
# real sign-in and real data before it goes live. It reads and writes the same database as the live app. Delete it when not needed.
ALLOWED_ORIGINS = "https://erp-live.pages.dev,https://worktree-ui-warm.erp-live.pages.dev"

# Request limit (src/middleware/rateLimit.ts; system audit 2026-11-03, finding 4): 600 requests a minute per signed-in user, or per
# IP where there is no user (webhooks). A page makes about six requests, so this only stops runaway scripts.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

# Per-IP limit before sign-in (audit 11 Nov 2026, finding 3): counts requests with no or a bad token too. Higher than the per-user
# limit because one office shares one IP. Needs a Cloudflare deploy to take effect.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1002"
simple = { limit = 3000, period = 60 }

# Delivers queued messages and sends reminders and escalations (src/jobs/outbox.ts). Also runnable on demand.
[triggers]
crons = ["*/5 * * * *"]
